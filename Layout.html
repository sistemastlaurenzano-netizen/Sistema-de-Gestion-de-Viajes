    <script>
        function showLoading(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }

        // FUNCIÓN ÚNICA DE NAVEGACIÓN Y CANDADO DE SEGURIDAD
        function navegar(pagina) {
            const usuarioActivo = sessionStorage.getItem('sys_usuario');

            // 1. Interceptor: Si no hay usuario y no va al login, lo forzamos al login
            if (!usuarioActivo && pagina !== 'login') {
                pagina = 'login'; 
            }

            // 2. Interfaz: Mostrar u ocultar la barra de navegación superior
            const navBarElement = document.getElementById('mainNavbar');
            if (navBarElement) {
                navBarElement.style.display = (pagina === 'login') ? 'none' : 'flex';
            }

            // 3. Interfaz: Mostrar el nombre del usuario si está logueado
            if (usuarioActivo) {
                document.getElementById('userDisplay').innerText = "👤 " + usuarioActivo;
            }

            // 4. Interfaz: Ocultar menú móvil al hacer clic
            const navCollapse = document.getElementById('navbarNav');
            if (navCollapse && navCollapse.classList.contains('show')) {
                bootstrap.Collapse.getInstance(navCollapse).hide();
            }

            showLoading(true);
            
            // 5. Carga de la página solicitada
            google.script.run
                .withSuccessHandler(html => {
                    inyectarYEjecutar(html);
                    showLoading(false);
                })
                .withFailureHandler(e => {
                    console.error("ERROR CRÍTICO EN EL SERVIDOR:", e);
                    document.getElementById('app-content').innerHTML = `<div class="alert alert-danger">Error de red: ${e.message}</div>`;
                    showLoading(false);
                })
                .apiGetPageHtml(pagina);
        }

        // MOTOR DE INYECCIÓN SPA
        function inyectarYEjecutar(htmlContent) {
            const container = document.getElementById('app-content');
            
            container.innerHTML = ""; 

            if (!htmlContent || htmlContent.startsWith("ERROR_CRITICO:")) {
                container.innerHTML = `
                    <div class="alert alert-danger mt-5 shadow">
                        <h4>⚠️ Error del Servidor</h4>
                        <p>${htmlContent || 'El servidor devolvió un contenido vacío.'}</p>
                    </div>`;
                return;
            }

            container.innerHTML = htmlContent;

            const scripts = container.querySelectorAll("script");
            scripts.forEach((oldScript) => {
                try {
                    const newScript = document.createElement("script");
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.text = oldScript.text;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                } catch (err) {
                    console.error("Error crítico ejecutando el script de la página:", err);
                    container.insertAdjacentHTML('afterbegin', `<div class="alert alert-warning">Error en el código de la vista: ${err.message}</div>`);
                }
            });
        }

        // --- ARRANQUE INICIAL ---
        // Esto dispara la app al cargar la URL. Intentará abrir 'viajes', 
        // pero la función navegar() interceptará y mostrará 'login' si no hay sesión.
        document.addEventListener('DOMContentLoaded', () => {
            navegar('viajes');
        });

    </script>
